name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q nova-project.zip
      - name: Inspect MainActivity lines 335-350
        run: sed -n '335,350p' NOVA-Launcher-v0.2/app/src/main/java/com/prajay/nova/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: NOVA-Launcher-v0.2
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-apk
          path: NOVA-Launcher-v0.2/app/build/outputs/apk/debug/*.apk
          
