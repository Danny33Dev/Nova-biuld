name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q nova-project.zip
      - name: Patch MainActivity.kt focusables error
        run: |
          python3 -c '
          p = "NOVA-Launcher-v0.2/app/src/main/java/com/prajay/nova/MainActivity.kt"
          lines = open(p).readlines()
          print("--- BEFORE ---")
          print("".join(f"{i+1}: {l}" for i, l in enumerate(lines) if 334 <= i <= 349))
          lines[342] = "// patched focusables\n"
          lines[343] = "window.decorView.findFocus() ?: window.decorView.requestFocus()\n"
          open(p, "w").writelines(lines)
          '
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: NOVA-Launcher-v0.2
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-apk
          path: NOVA-Launcher-v0.2/app/build/outputs/apk/debug/*.apk
          
